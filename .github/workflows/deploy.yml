# Deploys the site to Cloudflare (Worker "surfaces" with static assets, custom domain
# textures.lttl.info) on every push to main. Images are not part of this: they are uploaded
# to R2 from the owner's machine with `npm run upload`.
#
# Required repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token with "Workers Scripts: Edit" + "Workers Routes: Edit" on the account
#                          (dashboard: My Profile → API Tokens → "Edit Cloudflare Workers" template)
#   CLOUDFLARE_ACCOUNT_ID  the account id (dashboard → Workers & Pages → Account details)
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_IMAGE_BASE: https://img.textures.lttl.info
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
